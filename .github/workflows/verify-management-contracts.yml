name: Verify management schema source and package
on:
  push:
    branches: [main]
    paths: ['packages/management-contracts/**', '.github/workflows/verify-management-contracts.yml', 'package.json', 'package-lock.json', 'tsconfig.verification.json', 'tsconfig.verification-tests.json', 'verification-tests/**']
  pull_request:
    paths: ['packages/management-contracts/**', '.github/workflows/verify-management-contracts.yml', 'package.json', 'package-lock.json', 'tsconfig.verification.json', 'tsconfig.verification-tests.json', 'verification-tests/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  management-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Verify canonical typed tooling and reproducible JavaScript consumers
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:verification
          git diff --exit-code -- packages/management-contracts/tools
      - name: Verify current owner provenance without restoring retired repositories
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          from pathlib import Path, PurePosixPath
          record = Path('source-consolidation.json')
          assert record.is_file() and not record.is_symlink() and record.stat().st_size <= 65536
          data = json.loads(record.read_text())
          assert data['owner_repository'] == os.environ['GITHUB_REPOSITORY']
          for component in data.get('components', []):
              assert component['owner_repository'] == data['owner_repository']
              assert re.fullmatch(r'[0-9a-f]{40}', component['source_head'])
              path = PurePosixPath(component['subpath'])
              assert not path.is_absolute() and '..' not in path.parts
              assert (Path('.') / path).is_dir()
              assert not {'history_archive', 'history_ref', 'local_history_ref'} & component.keys()
          if not data.get('components'):
              assert re.fullmatch(r'[0-9a-f]{40}', data['source_sha'])
          assert 'canonical_history_bundle' not in data
          paths = subprocess.check_output(['git', 'ls-files', '-z'], timeout=10).decode().split('\0')
          assert len(paths) <= 8192
          assert not any(p.endswith('.bundle') or 'source-history' in PurePosixPath(p).parts for p in paths if p)
          print('Current owner provenance verified; no historical repository restoration')
          PYCODE
      - name: Verify schema-only source and package
        run: |
          cd packages/management-contracts
          npm run check
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-management-contracts
          path: ${{ runner.temp }}/zixcel-management-contracts-*.tgz
          if-no-files-found: error
          retention-days: 7
